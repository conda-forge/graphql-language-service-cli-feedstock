context:
  version: "4.0.1"

package:
  name: graphql-language-service-cli
  version: ${{ version }}

source:
  url: https://registry.npmjs.org/graphql-language-service-cli/-/graphql-language-service-cli-${{ version }}.tgz
  sha256: b35f5b32374abb617694de942dde22b63fe59d1d11d5a469d97a79f53c853360

build:
  number: 0
  noarch: generic

requirements:
  build:
    - nodejs
    - pnpm
    - pnpm-licenses
  run:
    - nodejs

tests:
  - script:
      - graphql-lsp --help

about:
  license: MIT
  license_file:
    - LICENSE
    - third-party-licenses.txt
  summary: Language Server for GraphQL
  homepage: https://github.com/graphql/graphiql
  repository: https://github.com/graphql/graphiql

extra:
  recipe-maintainers:
    - danielnachun
